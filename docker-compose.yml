name: realtime-board

# `docker compose up -d`                  -> Postgres + Redis only (run the apps with `npm run dev`)
# `docker compose --profile scale up`     -> + 2 server instances behind nginx with sticky sessions
x-server: &server
  profiles: [scale]
  build:
    context: .
    target: server
  restart: unless-stopped
  environment: &server-env
    PORT: "3001"
    DATABASE_URL: postgres://board:board@postgres:5432/board
    REDIS_URL: redis://redis:6379
    # The image runs with NODE_ENV=production, which refuses the public dev secret. A separate variable name
    # keeps the dev JWT_SECRET from your .env out of this profile. Set COMPOSE_JWT_SECRET for anything shared.
    JWT_SECRET: ${COMPOSE_JWT_SECRET:-compose-demo-secret-do-not-use-in-prod}
    PG_POOL_MAX: ${PG_POOL_MAX:-10}
    TRUST_PROXY: "1" # nginx is the one proxy in front of the instances
    SMTP_URL: ${SMTP_URL:-} # unset: emails are printed to the container log
    MAIL_FROM: ${MAIL_FROM:-Realtime Board <no-reply@localhost>}
    WEB_ORIGIN: http://localhost:${NGINX_PORT:-8088}
    AUTH_DEV_LOGIN: "true" # demo only: lets the sign-in page offer one-click fictional personas
    AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-20} # raise for `npm run loadtest`: it signs in many users from one IP
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:3001/ready"] # readiness: Postgres and Redis answer
    interval: 3s
    timeout: 3s
    retries: 20

services:
  server-1:
    <<: *server
    environment:
      <<: *server-env
      INSTANCE_ID: server-1

  server-2:
    <<: *server
    environment:
      <<: *server-env
      INSTANCE_ID: server-2

  nginx:
    profiles: [scale]
    build:
      context: .
      target: web
    ports:
      - "${NGINX_PORT:-8088}:80"
    depends_on:
      server-1: { condition: service_healthy }
      server-2: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: board
      POSTGRES_PASSWORD: board
      POSTGRES_DB: board
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d board"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
