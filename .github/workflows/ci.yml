name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://board:board@localhost:5432/board
  REDIS_URL: redis://localhost:6379

jobs:
  test:
    name: Typecheck, unit and integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: board
          POSTGRES_PASSWORD: board
          POSTGRES_DB: board
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U board -d board"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Audit production dependencies (fails on high or critical)
        run: npm run audit:prod
      - run: npm run test:unit
      - name: Integration tests (two server instances behind the Redis adapter)
        run: npm run test:integration
      - run: npm run build

  e2e:
    name: Playwright e2e (two browsers, two instances)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: board
          POSTGRES_PASSWORD: board
          POSTGRES_DB: board
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U board -d board"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  scale-profile:
    name: docker compose --profile scale smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build and start 2 instances behind nginx
        env:
          AUTH_RATE_LIMIT_PER_MIN: "10000" # the load test below signs in many users from one IP
        run: docker compose --profile scale up -d --build --wait
      - name: Both instances serve traffic through nginx
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8088/health
          curl -fsS http://localhost:8088/ready | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/metrics)" = 404
          for node in 1 2; do
            curl -fsS "http://localhost:8088/socket.io/?EIO=4&transport=polling&cid=ci-$node&node=$node" | grep -q '"sid"'
          done
          curl -fsS http://localhost:8088/ | grep -q "Realtime Board"
      - uses: grafana/setup-k6-action@v1.2.2
        with:
          k6-version: 2.3.0 # the script uses k6/ws; bump on purpose
      - name: Load test smoke (10 users for 10 s; fails on any lost, repeated or refused event)
        run: VUS=10 BOARDS=1 DURATION=10 RAMP=2 ACK_P95_MS=3000 FANOUT_P95_MS=3000 k6 run loadtest/board.js
      - name: Logs on failure
        if: failure()
        run: docker compose --profile scale logs --no-color

  deploy-config:
    name: Production compose file is valid
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: docker compose config (with the example env file filled in)
        env:
          JWT_SECRET: ci-only-not-a-secret
          POSTGRES_PASSWORD: ci-only
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.example config --quiet
      - name: Each required setting is enforced (no insecure defaults)
        run: |
          set -u
          export JWT_SECRET=ci-only WEB_ORIGIN=https://board.example.com POSTGRES_PASSWORD=ci-only
          for var in JWT_SECRET WEB_ORIGIN POSTGRES_PASSWORD; do
            if env -u "$var" docker compose -f deploy/docker-compose.prod.yml config --quiet 2>/dev/null; then
              echo "compose accepted a missing $var" >&2; exit 1
            fi
          done

  # Pushes the two images (API server and nginx + web app) to GitHub Container Registry once everything above is
  # green, on main and on version tags. Pull requests never publish.
  publish:
    name: Publish ${{ matrix.image }} image
    needs: [test, e2e, scale-profile, deploy-config]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            target: server
          - image: web
            target: web
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          # metadata-action lowercases the name; GHCR requires it.
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
