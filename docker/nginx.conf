worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream server_1 { server server-1:3001; }
  upstream server_2 { server server-2:3001; }

  # Sticky sessions: Socket.IO's HTTP long-polling handshake needs every request of a session to hit
  # the same instance. The web app adds a random per-tab `cid` query parameter to every Socket.IO
  # request, and we hash on it. (Hashing on $remote_addr would send every local tab to one instance.)
  upstream balanced {
    hash $arg_cid consistent;
    server server-1:3001;
    server server-2:3001;
  }

  # `?node=1` / `?node=2` pins a tab to an instance - handy for demos and debugging.
  map $arg_node $socket_pool {
    1       server_1;
    2       server_2;
    default balanced;
  }

  server {
    listen 80;
    root /usr/share/nginx/html;

    location /socket.io/ {
      proxy_pass http://$socket_pool;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Must exceed pingInterval + pingTimeout (25s + 20s) or idle sockets get cut with "transport close".
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_buffering off;
    }

    location /api/ {
      proxy_pass http://balanced;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
      proxy_pass http://balanced;
    }

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
